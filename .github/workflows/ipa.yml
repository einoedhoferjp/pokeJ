name: IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-ipa:
    name: Build unsigned .ipa
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project PokeJ.xcodeproj \
            -scheme PokeJ \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PokeJ.xcarchive" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" 2>&1 | tee "$RUNNER_TEMP/archive.log"

      - name: Fehlerbericht in die Job-Zusammenfassung
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/archive.log" ] || exit 0
          {
            echo "## Archive-Fehler"
            echo '```'
            grep -E "error:|fatal error:|\*\*\*" "$RUNNER_TEMP/archive.log" | head -60 || tail -60 "$RUNNER_TEMP/archive.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package .ipa
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/PokeJ.xcarchive/Products/Applications/PokeJ.app"
          test -d "$APP_PATH"
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry PokeJ.ipa Payload
          ls -lh PokeJ.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: PokeJ-unsigned-ipa
          path: ${{ runner.temp }}/PokeJ.ipa
          if-no-files-found: error
