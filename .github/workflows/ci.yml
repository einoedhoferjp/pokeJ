name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme PokeJ \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme PokeJ \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Fehlerbericht in die Job-Zusammenfassung
        if: failure()
        run: |
          for LOG in "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/test.log"; do
            [ -f "$LOG" ] || continue
            {
              echo "## Fehler aus $(basename "$LOG")"
              echo '```'
              grep -E "error:|fatal error:|\*\*\*" "$LOG" | head -60 || tail -60 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
