<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#FF4FD8"/>
      <stop offset="0.6" stop-color="#7A2CFF"/>
      <stop offset="1" stop-color="#1B0A4A"/>
    </radialGradient>
    <radialGradient id="body" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#FFF35C"/>
      <stop offset="1" stop-color="#FF9E00"/>
    </radialGradient>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4FD8"/>
      <stop offset="0.35" stop-color="#4FF3FF"/>
      <stop offset="0.7" stop-color="#FFF35C"/>
      <stop offset="1" stop-color="#9B5CFF"/>
    </linearGradient>
    <clipPath id="circ"><circle cx="256" cy="256" r="240"/></clipPath>
    <filter id="fry"><feComponentTransfer><feFuncR type="linear" slope="1.15" intercept="-0.05"/><feFuncG type="linear" slope="1.1" intercept="-0.03"/></feComponentTransfer></filter>
  </defs>

  <circle cx="256" cy="256" r="250" fill="#141414"/>
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>

  <g clip-path="url(#circ)" filter="url(#fry)">
    <!-- sunburst -->
    <g fill="#FFF35C" opacity="0.18">
      <path d="M256 256L40 0h60z"/><path d="M256 256L170 0h60z"/><path d="M256 256L300 0h60z"/><path d="M256 256L430 0h60z"/>
      <path d="M256 256L512 80v60z"/><path d="M256 256L512 220v60z"/><path d="M256 256L512 360v60z"/>
      <path d="M256 256L0 80v60z"/><path d="M256 256L0 220v60z"/><path d="M256 256L0 360v60z"/>
    </g>

    <!-- flying cards -->
    <g stroke="#1B0A4A" stroke-width="4">
      <rect x="40" y="130" width="52" height="72" rx="6" fill="url(#holo)" transform="rotate(-28 66 166)"/>
      <rect x="425" y="190" width="52" height="72" rx="6" fill="url(#holo)" transform="rotate(24 451 226)"/>
      <rect x="410" y="60" width="44" height="62" rx="6" fill="#fff" transform="rotate(-12 432 91)"/>
    </g>

    <!-- ears: absurd -->
    <ellipse cx="140" cy="170" rx="28" ry="66" fill="url(#body)" stroke="#1B0A4A" stroke-width="5" transform="rotate(-38 140 170)"/>
    <ellipse cx="376" cy="160" rx="34" ry="58" fill="url(#body)" stroke="#1B0A4A" stroke-width="5" transform="rotate(30 376 160)"/>

    <!-- body: potato -->
    <path d="M256 150c92-6 150 52 144 138-6 76-60 128-146 128S108 364 112 288c4-76 56-132 144-138z" fill="url(#body)" stroke="#1B0A4A" stroke-width="6"/>
    <ellipse cx="256" cy="365" rx="74" ry="40" fill="#FFF8C4" opacity="0.65"/>

    <!-- GIANT googly eyes -->
    <circle cx="198" cy="244" r="50" fill="#fff" stroke="#1B0A4A" stroke-width="6"/>
    <circle cx="318" cy="238" r="38" fill="#fff" stroke="#1B0A4A" stroke-width="6"/>
    <circle cx="178" cy="268" r="10" fill="#1B0A4A"/>
    <circle cx="336" cy="224" r="22" fill="#1B0A4A"/>
    <circle cx="342" cy="217" r="7" fill="#fff"/>
    <!-- sweat -->
    <path d="M385 215q14 24 0 34q-14-10 0-34z" fill="#7FE8FF" stroke="#1B0A4A" stroke-width="4"/>
    <!-- brow -->
    <path d="M270 188q40-26 80 8" fill="none" stroke="#1B0A4A" stroke-width="9" stroke-linecap="round"/>

    <!-- mega mouth w/ buck teeth, tongue -->
    <path d="M168 312q88 38 176 0q4 70-88 72q-86-2-88-72z" fill="#5A0F2E" stroke="#1B0A4A" stroke-width="6" stroke-linejoin="round"/>
    <rect x="226" y="318" width="26" height="34" rx="4" fill="#fff" stroke="#1B0A4A" stroke-width="4"/>
    <rect x="258" y="320" width="26" height="30" rx="4" fill="#fff" stroke="#1B0A4A" stroke-width="4"/>
    <path d="M232 372q10 36 44 24q16-12 2-34q-24 4-46 10z" fill="#FF5C8A" stroke="#1B0A4A" stroke-width="4" stroke-linejoin="round"/>
    <path d="M300 372q-4 28 4 42q12-8 8-40z" fill="#9FE8FF" stroke="#1B0A4A" stroke-width="3" stroke-linejoin="round"/>

    <!-- blush -->
    <circle cx="140" cy="318" r="18" fill="#FF4F8A" opacity="0.8"/>
    <circle cx="378" cy="312" r="14" fill="#FF4F8A" opacity="0.8"/>

    <!-- hand with pack -->
    <g transform="rotate(-22 96 360)">
      <path d="M58 296l10-8 10 8 10-8 10 8 10-8 10 8v110l-10 8-10-8-10 8-10-8-10 8-10-8z" fill="#E8302C" stroke="#1B0A4A" stroke-width="5" stroke-linejoin="round"/>
      <text x="98" y="360" font-family="Impact, Arial Black, sans-serif" font-size="18" text-anchor="middle" fill="#FFF35C">PACK</text>
    </g>
    <circle cx="140" cy="372" r="20" fill="#FFB020" stroke="#1B0A4A" stroke-width="5"/>
    <!-- hand with slab -->
    <g transform="rotate(14 420 360)">
      <rect x="372" y="296" width="92" height="130" rx="9" fill="#EAF3FF" stroke="#1B0A4A" stroke-width="5"/>
      <rect x="380" y="304" width="76" height="20" rx="3" fill="#C8102E"/>
      <text x="418" y="320" font-family="Impact, Arial Black, sans-serif" font-size="14" text-anchor="middle" fill="#fff">PSA 10</text>
      <rect x="382" y="332" width="72" height="84" rx="5" fill="url(#holo)"/>
      <path d="M418 346l8 17 19 3-14 13 3 19-16-9-16 9 3-19-14-13 19-3z" fill="#fff" opacity="0.95"/>
    </g>
    <circle cx="372" cy="388" r="20" fill="#FFB020" stroke="#1B0A4A" stroke-width="5"/>
  </g>
</svg>
