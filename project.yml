name: PokeJ
options:
  bundleIdPrefix: local.pokej
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    MARKETING_VERSION: "0.2.4"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  PokeJ:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Domain
      - path: Data
      - path: Features
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.pokej.app
        PRODUCT_NAME: PokeJ
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_NSCameraUsageDescription: "Zum Scannen von Pokémon-Karten."
        INFOPLIST_KEY_CFBundleDisplayName: "PokéJ"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PokéJ
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: "Zum Scannen von Pokémon-Karten."
        # Tägliche Preisaktualisierung im Hintergrund (Best-Effort, von iOS
        # getaktet): Preise bleiben auch frisch, wenn die App nicht offen ist.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - local.pokej.app.prices
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    scheme:
      testTargets:
        - PokeJTests

  PokeJTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/PokeJTests
    dependencies:
      - target: PokeJ
